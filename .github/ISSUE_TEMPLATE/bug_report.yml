name: Bug Report
description: File a bug report for OmniTrading
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Never include personal credentials or account numbers in issue reports.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open chart
        2. Click ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS (Windows, macOS, Linux) and Node.js version.
      placeholder: e.g. Ubuntu 24.04, Node 20.18.0, Chromium 130
