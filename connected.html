<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniTrading — Broker Connected</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0e11; }
      body {
        display: grid;
        place-items: center;
        color: #e7edf3;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .card {
        width: min(440px, calc(100vw - 48px));
        padding: 32px;
        text-align: center;
        border: 1px solid #263039;
        border-radius: 16px;
        background: #12161c;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 14px;
        background: linear-gradient(135deg, #22d3a5, #4f8bff);
        color: #071015;
        font-size: 26px;
        font-weight: 800;
      }
      h1 { margin: 0 0 8px; font-size: 21px; letter-spacing: -0.02em; }
      p { margin: 0; color: #8b98a5; font-size: 13px; line-height: 1.6; }
      .hint { margin-top: 18px; color: #22d3a5; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">Ω</div>
      <h1>Broker Connected</h1>
      <p>You can close this tab and return to OmniTrading. The app will pick up the connection automatically.</p>
      <p class="hint">Remembered on this machine — no passwords stored.</p>
    </div>
    <script>
      setTimeout(() => window.close(), 1500);
    </script>
  </body>
</html>
